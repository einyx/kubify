id: product-full
name: Product (full)
description: Full product data mesh — backend, frontend, AI, trino, kafka, vault, dai. Requires kubo-system/product-<tenant>-* secrets.
defaults:
  seedVault:
    # Product knowledge lives HERE, not in the controller: static entries
    # copy shared credentials from canonical kubo-system sources; generated
    # entries mint fresh per-tenant credentials. Nothing is sourced from
    # another tenant.
    static:
      - name: product-{{.Tenant}}-backend-auth0
        copyFrom:
          name: kubo-shared-auth0-backend
          keys:
            MX_AUTH0_CLIENT_ID: MX_AUTH0_CLIENT_ID
            MX_AUTH0_CLIENT_SECRET: MX_AUTH0_CLIENT_SECRET
            MX_AUTH0_DOMAIN: MX_AUTH0_DOMAIN
      - name: product-{{.Tenant}}-frontend-auth0
        literal:
          APP_BASE_URL: https://product-{{.Tenant}}.meshx.foundation
          AUTH0_BASE_URL: https://product-{{.Tenant}}.meshx.foundation
        copyFrom:
          name: kubo-shared-auth0-frontend
          keys:
            AUTH0_CLIENT_ID: AUTH0_CLIENT_ID
            AUTH0_CLIENT_SECRET: AUTH0_CLIENT_SECRET
            AUTH0_DOMAIN: AUTH0_DOMAIN
            AUTH0_AUDIENCE: AUTH0_AUDIENCE
            AUTH0_ISSUER_BASE_URL: AUTH0_ISSUER_BASE_URL
      - name: product-{{.Tenant}}-trino-auth0
        copyFrom:
          name: kubo-shared-auth0-trino
          keys:
            client_id: client_id
            client_secret: client_secret
      - name: product-{{.Tenant}}-ai-secrets
        copyFrom:
          name: kubo-shared-ai
          keys:
            MX_ANTHROPIC_API_KEY: MX_ANTHROPIC_API_KEY
            MX_AUTH0_CLIENT_SECRET: MX_AUTH0_CLIENT_SECRET
      - name: product-{{.Tenant}}-dai-backend
        copyFrom:
          name: kubo-shared-dai-backend
      - name: product-{{.Tenant}}-dai-frontend
        copyFrom:
          name: kubo-shared-dai-frontend
      - name: ghcr-pull-secret
        copyFrom:
          name: ghcr-pull-secret
          namespace: acr-cache-system
      - name: acr-pull-secret
        copyFrom:
          name: acr-pull-secret
          namespace: acr-cache-system
      - name: meshxregistry-helm-secret
        copyFrom:
          name: meshxregistry-helm-secret
          namespace: acr-cache-system
    generated:
      - name: product-{{.Tenant}}-trino-jwt-signing-key
        type: kubernetes.io/tls
        generate:
          tls.key: {kind: tls}
      - name: product-{{.Tenant}}-trino-credentials
        generate:
          password.db: {kind: bcrypt}
      - name: product-{{.Tenant}}-trino-s3-credentials
        generate:
          MINIO_ACCESS_KEY: {kind: hex, length: 16}
          MINIO_SECRET_ACCESS_KEY: {kind: hex, length: 32}
      - name: product-{{.Tenant}}-hive-metastore-minio-credentials
        generate:
          MINIO_ACCESS_KEY: {kind: hex, length: 16}
          MINIO_SECRET_KEY: {kind: hex, length: 32}
      - name: product-{{.Tenant}}-backend-auth0
        # MX_POSTGRES_PASSWORD must match the postgres auth.password above —
        # the backend sidecars read it via envFrom. Pin it; only the truly
        # random keys stay generated.
        literal:
          MX_POSTGRES_PASSWORD: product
      - name: product-{{.Tenant}}-backend-auth0
        generate:
          MX_SECRET_KEY: {kind: base64, length: 32}
          MX_TRINO_JWT_SECRET_KEY: {kind: base64, length: 48}
      - name: product-{{.Tenant}}-ai-secrets
        copyFrom:
          name: kubo-shared-ai
          keys:
            MX_ANTHROPIC_API_KEY: MX_ANTHROPIC_API_KEY
            MX_AUTH0_CLIENT_SECRET: MX_AUTH0_CLIENT_SECRET
        literal:
          # Must match the postgres auth.password above.
          MX_DB_PASSWORD: product
          MX_DB_USER: product
      - name: product-{{.Tenant}}-ai-secrets
        generate:
          MX_MCP_SERVICE_TOKEN: {kind: hex, length: 32}

  mode: Direct

---
apiVersion: v1
kind: Namespace
metadata:
  name: product-{{.Tenant}}
---
apiVersion: platform.kubo.io/v1alpha1
kind: Stack
metadata:
  name: product
  namespace: product-{{.Tenant}}
spec:
  # Secrets are pre-created in kubo-system with the "product-{{.Tenant}}-" prefix
  # and propagated here by the kubo operator on every reconcile.
  secretsRef:
    - from: product-{{.Tenant}}-backend-auth0
      to: backend-auth0
    - from: product-{{.Tenant}}-frontend-auth0
      to: product-frontend-auth0
    - from: product-{{.Tenant}}-trino-jwt-signing-key
      to: trino-jwt-signing-key
    - from: product-{{.Tenant}}-trino-credentials
      to: trino-credentials
    - from: product-{{.Tenant}}-trino-auth0
      to: trino-auth0
    - from: product-{{.Tenant}}-trino-s3-credentials
      to: trino-s3-credentials
    - from: product-{{.Tenant}}-ai-secrets
      to: product-ai-secrets
    - from: product-{{.Tenant}}-hive-metastore-minio-credentials
      to: hive-metastore-minio-credentials
    - from: product-{{.Tenant}}-dai-backend
      to: dai-backend
    - from: product-{{.Tenant}}-dai-frontend
      to: dai-frontend-auth0
  componentValues:
    backend:
      image:
        repository: meshxregistry.azurecr.io/cached/ecr-meshx/foundation/backend
        tag: v0.5.62
      config:
        auth0:
          audience: "https://demo.meshx.foundation/"
          client_id: VaSTC5RcCTSQlphYUySBNlnmqMyzVvf8
          domain: auth0-stg.meshx.app
          enabled: true
        kafka:
          cluster_host: kafka:9092
        scheduler:
          host: scheduler
          port: 65434
        watcher:
          # fullnameOverride below is per-tenant so the ClusterRole does not
          # collide across tenants; point the backend at the tenant's service.
          host: watcher-{{.Tenant}}
        postgres:
          database: product
          host: postgres-postgresql
          port: 5432
        mcp:
          enabled: true
          publicUrl: https://product-{{.Tenant}}.meshx.foundation
          auth0Audience: "https://demo.meshx.foundation/"
      env:
      # Data-system connector image: use the ACR mirror path (the default is
      # the raw ECR registry, which cluster nodes cannot pull from).
      - name: MX_DOCKER_REPOSITORY
        value: meshxregistry.azurecr.io/cached/ecr-meshx/foundation/foundation-data
      # The backend image defaults its postgres user to a legacy name — pin it
      # to the auth.username this template provisions.
      - name: MX_POSTGRES_USER
        value: product
      # backend-mcp entrypoint requirement: the backend's own API base
      - name: MX_FOUNDATION_API_URL
        value: http://localhost:65432
      - name: MX_AUTH0_CLIENT_ID
        value: VaSTC5RcCTSQlphYUySBNlnmqMyzVvf8
      - name: MX_POSTGRES_PASSWORD
        value: product
      - name: MX_SECRET_KEY
        value: dev-local-secret
      - name: MX_S3_ENDPOINT_LOCATION
        value: http://storage-engine:8080
      - name: MX_S3_ACCESS_KEY_ID
        value: product-{{.Tenant}}
      - name: MX_S3_SECRET_ACCESS_KEY
        value: e95df32785232200f1934146dba4039ea6572113eebbe485
      - name: MX_S3_REGION_NAME
        value: us-east-1
      - name: MX_S3_PATH_STYLE_ACCESS
        value: "true"
      - name: MX_S3_SIGNATURE_VERSION
        value: s3v4
      - name: MX_PRODUCT_API_URL
        value: http://localhost:65432
      - name: MX_AUTH0_DOMAIN
        value: auth0-stg.meshx.app
      - name: MX_AUTH0_MANAGEMENT_DOMAIN
        value: meshx-stg.eu.auth0.com
      sidecar:
        mcp:
          enabled: true
      extraEnvFrom:
      - secretRef:
          name: backend-auth0

    frontend:
      image:
        repository: meshxregistry.azurecr.io/cached/ecr-meshx/foundation/frontend
        tag: v0.7.37
      # Traffic goes through the Istio VirtualService; the chart's default
      # Ingress has no hosts configured and is rejected as invalid.
      ingress:
        enabled: false
      externalSecret:
        enabled: true
        target:
          name: product-frontend-auth0
      env:
        internal_api_url: http://backend:8000/
        auth0:
          enabled: "true"
          secret: ""
          baseurl: ""
          issuer_baseurl: ""
          client_id: ""
          audience: ""
          domain: ""
      virtualService:
        enabled: true
        gateway: product/product-gateway
        gatewayNamespace: product
        host: product-{{.Tenant}}.meshx.foundation
        additionalHosts:
        - product-{{.Tenant}}.meshx.foundation
        extraHttp:
        - name: dai
          match:
          - uri:
              prefix: /dai
          route:
          - destination:
              host: dai-frontend
              port:
                number: 3000
          timeout: 50s
        - name: mcp
          match:
          - uri:
              prefix: /mcp
          route:
          - destination:
              host: backend
              port:
                number: 8765
          timeout: 300s
        - name: ai
          match:
          - uri:
              prefix: /ai
          route:
          - destination:
              host: ai-product-ai
              port:
                number: 8000
          timeout: 300s
        http:
          cors:
            allowHeaders:
            - X-Account
            - Content-Type
            - Authorization
            allowMethods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
            allowOrigins:
            - exact: https://product-{{.Tenant}}.meshx.foundation
          destination:
            host: frontend
            port: 80
          matchPrefix: /
          name: frontend
          responseHeaders:
            StrictTransportSecurity: max-age=31536000
          timeout: 50s
        name: frontend

    kafka:
      extraConfig: ''
      global:
        security:
          allowInsecureImages: true
      image:
        repository: bitnamilegacy/kafka
      listeners:
        client:
          protocol: PLAINTEXT
      controller:
        resources:
          limits:
            cpu: "2"
            memory: 4Gi
          requests:
            cpu: 500m
            memory: 2Gi
        heapOpts: "-Xmx3g -Xms1g"

    opa:
      image:
        registry: meshxregistry.azurecr.io
        repository: cached/ecr-meshx/foundation/opa
        tag: v0.5.62
      env:
        API_BASE_URL: http://backend:65432

    postgres:
      auth:
        database: product
        password: product
        username: product
      global:
        security:
          allowInsecureImages: true
      image:
        repository: bitnamilegacy/postgresql
      primary:
        # Per-tenant dedicated instance sizing: the chart defaults were
        # 100m/128Mi requests with a 150m/192Mi limit — Postgres was CPU-
        # and RAM-starved (shared_buffers 160MB, work_mem 4MB).
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: "2"
            memory: 2Gi
        extendedConfiguration: |
          # Sized for a 2Gi-limit dedicated instance
          shared_buffers = 512MB
          effective_cache_size = 1536MB
          work_mem = 16MB
          maintenance_work_mem = 256MB
          max_connections = 200
          # SSD-backed PVC: favour index/random scans
          random_page_cost = 1.1
          effective_io_concurrency = 256
          # Checkpoints: spread I/O, larger WAL = fewer full-page writes
          checkpoint_completion_target = 0.9
          wal_buffers = 16MB
          min_wal_size = 512MB
          max_wal_size = 2GB
        initdb:
          scripts:
            grant_public.sql: |
              GRANT CREATE ON SCHEMA public TO product;

    processor:
      replicaCount: 1
      autoscaling:
        enabled: false
      image:
        repository: meshxregistry.azurecr.io/cached/ecr-meshx/foundation/processor
        tag: v0.2.33
      config:
        kafka:
          cluster_host: kafka:9092
        postgres:
          password: product
          database: product
          host: postgres-postgresql
          port: 5432
          user: product
        iceberg:
          s3_endpoint: http://storage-engine:8080
          s3_access_key_id: product-{{.Tenant}}
          s3_secret_access_key: e95df32785232200f1934146dba4039ea6572113eebbe485
      externalSecret:
        enabled: false
      imagePullSecrets:
      - name: acr-pull-secret
      migrations:
        enabled: false
      serviceAccount:
        # The chart names the ClusterRole "<serviceAccount>-clusterrole";
        # it must be unique per tenant or installs collide cluster-wide.
        name: product-{{.Tenant}}-processor
      resources:
        limits:
          cpu: "1"
          memory: 1Gi
        requests:
          cpu: 500m
          memory: 512Mi

    scheduler:
      image:
        repository: meshxregistry.azurecr.io/cached/ecr-meshx/foundation/scheduler
        tag: v1.1.10
      config:
        MX_KAFKA_CLUSTER_HOST: kafka:9092
        MX_POSTGRES_DATABASE: product
        MX_POSTGRES_HOST: postgres-postgresql
        MX_POSTGRES_PORT: 5432
        MX_POSTGRES_USER: product
        MX_SCHEDULER_HOST: 0.0.0.0
      imagePullSecrets:
      - name: acr-pull-secret
      initContainer:
        enabled: true
      secret:
        MX_POSTGRES_PASSWORD: product

    storage-engine:
      image:
        repository: meshxregistry.azurecr.io/cached/ecr-meshx/foundation/storage-engine
        tag: v0.0.43
      externalSecrets:
        enabled: false
        aws:
          enabled: false
        azure:
          enabled: false
        auth:
          enabled: false
        sentry:
          enabled: false
      config:
        auth:
          type: awsv4
          identity: product-{{.Tenant}}
          credential: e95df32785232200f1934146dba4039ea6572113eebbe485
        storage:
          provider: filesystem
          filesystem:
            baseDir: /data
        virusTotal:
          enabled: false
      configFile:
        enabled: true
        filename: storage-engine.yaml
        content: |
          server:
            listen: ":8080"
            read_timeout: 600s
            write_timeout: 600s
            idle_timeout: 120s
            max_body_size: 5368709120
          storage:
            provider: filesystem
            filesystem:
              root_path: /data
          auth:
            type: awsv4
          ui:
            enabled: false
          logging:
            level: info
            format: json

    trino:
      image:
        repository: meshxregistry.azurecr.io/trinodb/trino
        tag: "482-meshX"
      imagePullSecrets:
      - name: acr-pull-secret
      serviceAccount:
        create: false
      server:
        workers: 2
        exchangeManager:
          name: filesystem
      accessControl:
        type: properties
        properties: |
          access-control.name=opa
          opa.policy.uri=http://opa:8181/v1/data/trino/authz/allow
          opa.policy.batched-uri=http://opa:8181/v1/data/trino/authz/batch
          opa.policy.batch-column-masking-uri=http://opa:8181/v1/data/trino/authz/batchColumnMasks
          opa.log-requests=true
          opa.log-responses=true
          opa.allow-permission-management-operations=false
          opa.http-client.request-timeout=60s
          opa.http-client.max-requests-queued-per-destination=10000
      additionalConfigProperties:
      - catalog.management=dynamic
      - retry-policy=TASK
      - task.concurrency=16
      - task.max-worker-threads=64
      - query.max-memory=8GB
      - query.max-memory-per-node=4GB
      - query.max-total-memory=12GB
      - memory.heap-headroom-per-node=2GB
      - query.remote-task.max-error-duration=5m
      - query.low-memory-killer.policy=total-reservation-on-blocked-nodes
      - exchange.client-threads=25
      - exchange.concurrent-request-multiplier=3
      - exchange.max-buffer-size=32MB
      - exchange.max-response-size=32MB
      - sink.max-buffer-size=32MB
      - http-server.authentication.type=JWT,PASSWORD
      - http-server.process-forwarded=true
      - internal-communication.shared-secret=change-this-to-a-random-secret-value
      - http-server.authentication.jwt.key-file=/etc/trino/jwt/${KID}.pem
      - http-server.authentication.jwt.principal-field=sub
      - http-server.authentication.allow-insecure-over-http=true
      additionalExchangeManagerProperties:
      - exchange.base-directories=s3://trino/trino-exchange
      - exchange.s3.endpoint=http://storage-engine:8080
      - exchange.s3.region=me-central-1
      - exchange.s3.aws-access-key=${ENV:MINIO_USERNAME}
      - exchange.s3.aws-secret-key=${ENV:MINIO_PASSWORD}
      - exchange.s3.path-style-access=true
      - exchange.sink-buffer-pool-min-size=10
      - exchange.sink-buffers-per-partition=2
      - exchange.source-concurrent-readers=4
      env:
      - name: MINIO_USERNAME
        valueFrom:
          secretKeyRef:
            name: trino-s3-credentials
            key: MINIO_ACCESS_KEY
      - name: MINIO_PASSWORD
        valueFrom:
          secretKeyRef:
            name: trino-s3-credentials
            key: MINIO_SECRET_ACCESS_KEY
      - name: TRINO_OAUTH2_CLIENT_ID
        valueFrom:
          secretKeyRef:
            name: trino-auth0
            key: client_id
      - name: TRINO_OAUTH2_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: trino-auth0
            key: client_secret
      secretMounts:
      - name: trino-credentials
        path: /etc/trino/auth/password
        secretName: trino-credentials
      coordinator:
        additionalConfigProperties:
        - web-ui.authentication.type=OAUTH2
        additionalConfigFiles:
          password-authenticator.properties: |
            password-authenticator.name=file
            file.password-file=/etc/trino/auth/password/password.db
        jvm:
          maxHeapSize: "8G"
          gcMethod:
            type: UseG1GC
            g1:
              heapRegionSize: "32M"
        resources:
          limits:
            cpu: 4
            memory: "12Gi"
          requests:
            cpu: 2
            memory: "8Gi"
        additionalVolumes:
        - emptyDir: {}
          name: trino-cache
        - name: signing-cert
          secret:
            secretName: trino-jwt-signing-key
        - emptyDir: {}
          name: jwt-config
        additionalVolumeMounts:
        - mountPath: /mnt/trino-cache
          name: trino-cache
        - mountPath: /etc/trino/jwt
          name: jwt-config
          readOnly: true
      worker:
        additionalConfigFiles:
          password-authenticator.properties: |
            password-authenticator.name=file
            file.password-file=/etc/trino/auth/password/password.db
        jvm:
          maxHeapSize: "6G"
          gcMethod:
            type: UseG1GC
            g1:
              heapRegionSize: "32M"
        replicas: 2
        resources:
          limits:
            cpu: 2
            memory: "8Gi"
          requests:
            cpu: 1
            memory: "4Gi"
        additionalVolumeMounts:
        - mountPath: /mnt/trino-cache
          name: trino-cache
        additionalVolumes:
        - emptyDir: {}
          name: trino-cache

    ai:
      image:
        repository: meshxregistry.azurecr.io/cached/ecr-meshx/foundation/ai
        tag: v0.0.2
      imagePullSecrets:
      - name: acr-pull-secret
      externalSecret:
        enabled: false
      readinessProbe:
        httpGet:
          path: /health
          port: http
        initialDelaySeconds: 10
        timeoutSeconds: 5
        periodSeconds: 15
      extraEnvFrom:
      - secretRef:
          name: product-ai-secrets
      config:
        env:
          MX_DB_HOST: postgres-postgresql
          MX_DB_PORT: "5432"
          MX_DB_NAME: product
          MX_DB_USER: product
          MX_AUTH0_DOMAIN: auth0-stg.meshx.app
          MX_AUTH0_CLIENT_ID: VaSTC5RcCTSQlphYUySBNlnmqMyzVvf8
          MX_AUTH0_AUDIENCE: "https://demo.meshx.foundation/"
          MX_PRODUCT_DATA_MCP_URL: http://backend:8765/mcp
          MX_MCP_OAUTH_REDIRECT_URI: https://product-{{.Tenant}}.meshx.foundation/ai/oauth/mcp-callback
          MX_DEFAULT_MODEL: claude-sonnet-4-6
          # Egress via the tenant agentfw (forward proxy). All LLM/MCP egress is
          # tunneled through agentfw:8080; internal services bypass it (and its
          # blockPrivateEgress rule). Audit stream: kubectl -n product-{{.Tenant}} logs -f deploy/agentfw
          HTTPS_PROXY: http://agentfw:8080
          HTTP_PROXY: http://agentfw:8080
          NO_PROXY: postgres-postgresql,backend,localhost,127.0.0.1,.svc,.cluster.local
          no_proxy: postgres-postgresql,backend,localhost,127.0.0.1,.svc,.cluster.local

    dai-backend:
      image:
        repository: meshxregistry.azurecr.io/cached/ecr-meshx/dai/backend
        tag: v0.2.79
      imagePullSecrets:
      - name: acr-pull-secret
      migrations:
        enabled: true
      streamlit:
        enabled: false
      configMap:
        # The chart gates its ConfigMap behind this flag; without it the
        # migrations Job (a pre-install hook) fails with configmap
        # "dai-backend" not found. The keep policy also protects the CM from
        # the controller's uninstall-retry of a failed/pending release, and
        # lets the pre-install hook run before the chart renders resources.
        enabled: true
        annotations:
          helm.sh/resource-policy: keep
        data:
          MX_NATS_URL: "nats://nats:4222"
          MX_NATS_AUTO_CREATE_STREAM: "true"
          MX_MONGO_DATABASE: "dai"
          MX_LLM_PROVIDER_TYPE: "anthropic"
          MX_AUTH0_DOMAIN: "auth0-stg.meshx.app"
          MX_AUTH0_ISSUER: "https://auth0-stg.meshx.app/"
          MX_AUTH0_AUDIENCE: "https://demo.meshx.foundation/"
          MX_AUTH0_ENABLED: "true"
          MX_ENV: "production"
          MX_RELEASE_TAG: "v0.2.79"
          MX_POSTGRES_HOST: "postgres-postgresql"
          MX_POSTGRES_PORT: "5432"
          MX_POSTGRES_USER: "product"
          MX_POSTGRES_DATABASE: "product"
          MX_POSTGRES_SSLMODE: "disable"

    dai-frontend:
      image:
        repository: meshxregistry.azurecr.io/foundation/dai-frontend
        tag: basepath
      imagePullSecrets:
      - name: acr-pull-secret
      virtualService:
        enabled: false
      env:
      - name: NEXT_PUBLIC_BASE_PATH
        value: /dai
      - name: AUTH0_ISSUER_BASE_URL
        value: https://auth0-stg.meshx.app
      - name: AUTH0_BASE_URL
        value: https://product-{{.Tenant}}.meshx.foundation/dai
      - name: API_URL
        value: http://dai-backend:8000
      extraEnvFrom:
      - secretRef:
          name: dai-frontend-auth0

    watcher:
      replicaCount: 1
      autoscaling:
        enabled: false
      image:
        repository: meshxregistry.azurecr.io/cached/ecr-meshx/foundation/watcher
        tag: v2.0.25
      config:
        # Chart 2.7.5+: ship the corrected SparkApplication template (the one
        # baked into images <= v2.0.25 omits the ConfigMap volume, killing all
        # data-system ingestion drivers at startup).
        spark_template_overlay:
          enabled: true
        postgres:
          database: product
          host: postgres-postgresql
          port: 5432
          user: product
          existingSecret: postgres-postgresql
          # The watcher authenticates as the "product" app user (auth.username
          # above), so it must read that user's password key — not the
          # generated superuser key, which drifts from the database on
          # re-provisioning.
          existingSecretSuperUserKey: password
      # Per-tenant fullname so the ClusterRole "<fullname>-metrics-reader"
      # does not collide across tenants; the backend's config.watcher.host
      # above must match this service name.
      fullnameOverride: watcher-{{.Tenant}}

  extraBundles:
  - url: oci://ghcr.io/meshxdata/dai-bundle:0.0.8
    secretRef:
      name: ghcr-pull-secret

  exclude: []

  inline:
    components:
    - chartPullSecretRef:
        name: acr-pull-secret
      chartRef:
        chartName: nats
        chartVersion: 2.10.1
        repoURL: oci://meshxregistry.azurecr.io/kubo/charts
      name: nats
      scope: Namespaced
    - chartPullSecretRef:
        name: ghcr-pull-secret
      chartRef:
        chartName: postgresql
