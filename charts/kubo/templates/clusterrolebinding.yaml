apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubo-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubo-manager-role
subjects:
- kind: ServiceAccount
  name: kubo-controller-manager
  namespace: {{ .Release.Namespace }}
