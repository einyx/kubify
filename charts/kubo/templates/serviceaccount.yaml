apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubo-controller-manager
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kubo
  {{- /* Run as a pre-install hook so the webhook cert-init Job (also a
         hook) can use it; plain resources are created after hooks. */}}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
