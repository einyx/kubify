      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: 'Stack deploys a named StackDefinition into its own namespace.
          The

          abstraction is product-agnostic: product-a, product-b, product-c or any

          future product is just a StackDefinition.'
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation
              of an object.

              Servers should convert recognized schemas to the latest internal value,
              and

              may reject unrecognized values.

              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this
              object represents.

              Servers may infer this from the endpoint the client submits requests
              to.

              Cannot be updated.

              In CamelCase.

              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            description: StackSpec defines a namespaced instance of a stack.
            properties:
              bundle:
                description: 'Bundle pulls one OCI artifact (for example oci://ghcr.io/org/product-bundle:tag)

                  and installs Helm charts from its charts.tgz layer. Usable alone,
                  or with

                  StackRef/Inline to select which charts to install. Charts missing
                  from the

                  bundle keep their ChartRef.'
                properties:
                  secretRef:
                    description: 'SecretRef is a kubernetes.io/dockerconfigjson Secret
                      used to pull the bundle.

                      Required for private registries such as GHCR.'
                    properties:
                      name:
                        default: ''
                        description: 'Name of the referent.

                          This field is effectively required, but due to backwards
                          compatibility is

                          allowed to be empty. Instances of this type with an empty
                          value here are

                          almost certainly wrong.

                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names'
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                  url:
                    description: 'URL is an OCI reference, including the tag or digest.

                      Example: oci://ghcr.io/org/product-bundle:0.0.8'
                    minLength: 1
                    type: string
                required:
                - url
                type: object
              componentValues:
                additionalProperties:
                  x-kubernetes-preserve-unknown-fields: true
                description: ComponentValues holds per-component Helm value overrides.
                type: object
              exclude:
                description: 'Exclude names bundle charts to skip. Only applied when
                  installing directly

                  from a Bundle (no StackRef/Inline).'
                items:
                  type: string
                type: array
              extraBundles:
                description: 'ExtraBundles lists additional OCI bundle artifacts to
                  merge into the chart

                  map alongside Bundle. Charts in later entries override earlier ones.'
                items:
                  description: BundleSource is an OCI artifact that carries the stack's
                    charts.
                  properties:
                    secretRef:
                      description: 'SecretRef is a kubernetes.io/dockerconfigjson
                        Secret used to pull the bundle.

                        Required for private registries such as GHCR.'
                      properties:
                        name:
                          default: ''
                          description: 'Name of the referent.

                            This field is effectively required, but due to backwards
                            compatibility is

                            allowed to be empty. Instances of this type with an empty
                            value here are

                            almost certainly wrong.

                            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names'
                          type: string
                      type: object
                      x-kubernetes-map-type: atomic
                    url:
                      description: 'URL is an OCI reference, including the tag or
                        digest.

                        Example: oci://ghcr.io/org/product-bundle:0.0.8'
                      minLength: 1
                      type: string
                  required:
                  - url
                  type: object
                type: array
              featureFlags:
                additionalProperties:
                  type: string
                description: 'FeatureFlags groups the tenant''s frontend feature flags
                  in one place

                  instead of burying them inside componentValues. Keys are the chart''s

                  feature_flags names (lowercase snake_case, e.g. "connectors_enabled");

                  the full env form ("MX_FF_CONNECTORS_ENABLED") is also accepted
                  and

                  normalized. Values are strings ("true"/"false"). Compiled into the

                  frontend component''s env.feature_flags with the highest precedence.'
                type: object
              gitRef:
                description: 'GitRef points to a Flux GitRepository in the same namespace.

                  Kubo reads status.artifact.url to fetch charts without cloning git
                  directly,

                  reusing Flux''s existing auth secrets.'
                properties:
                  path:
                    description: 'Path is the file inside the cloned repo to use as
                      the charts archive.

                      Must be a .tgz containing Helm charts. Defaults to "charts.tgz".'
                    type: string
                  provider:
                    description: "Provider enables cloud-native auth. Only \"azure\"\
                      \ is supported \u2014 uses\nworkload identity (IMDS) to obtain\
                      \ an Azure DevOps access token.\nWhen set, SecretRef is ignored."
                    type: string
                  ref:
                    description: Ref is the branch, tag, or commit SHA to check out.
                      Defaults to "main".
                    type: string
                  secretRef:
                    description: 'SecretRef names a Secret in the same namespace used
                      for git authentication.

                      For HTTPS: must contain "username" and "password" keys.

                      For SSH: must contain an "identity" key (private key PEM).

                      Ignored when Provider is set.'
                    properties:
                      name:
                        default: ''
                        description: 'Name of the referent.

                          This field is effectively required, but due to backwards
                          compatibility is

                          allowed to be empty. Instances of this type with an empty
                          value here are

                          almost certainly wrong.

                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names'
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                  url:
                    description: 'URL is the HTTPS or SSH git repository URL.

                      Example: https://github.com/org/repo.git'
                    minLength: 1
                    type: string
                required:
                - url
                type: object
