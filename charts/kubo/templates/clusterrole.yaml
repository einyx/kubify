apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubo-manager-role
rules:
- apiGroups: [""]
  resources: [configmaps, persistentvolumeclaims, pods, secrets, serviceaccounts, services]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [""]
  resources: [namespaces]
  verbs: [create, get, list, watch]
- apiGroups: [""]
  resources: [events]
  verbs: [create, patch]
- apiGroups: [apps]
  resources: [daemonsets, deployments, replicasets, statefulsets]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [autoscaling]
  resources: [horizontalpodautoscalers]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [helm.toolkit.fluxcd.io]
  resources: [helmreleases]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [helm.toolkit.fluxcd.io]
  resources: [helmreleases/status]
  verbs: [get]
- apiGroups: [networking.k8s.io]
  resources: [ingresses, networkpolicies]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [platform.kubo.io]
  resources: [stackdefinitions, stacks]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [platform.kubo.io]
  resources: [demorequests]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [platform.kubo.io]
  resources: [demorequests/status]
  verbs: [get, update, patch]
- apiGroups: [platform.kubo.io]
  resources: [stackdefinitions/finalizers, stacks/finalizers]
  verbs: [update]
- apiGroups: [platform.kubo.io]
  resources: [stackdefinitions/status, stacks/status]
  verbs: [get, patch, update]
- apiGroups: [policy]
  resources: [poddisruptionbudgets]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [rbac.authorization.k8s.io]
  resources: [clusterrolebindings, clusterroles, rolebindings, roles]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [source.toolkit.fluxcd.io]
  resources: [helmrepositories]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [admissionregistration.k8s.io]
  resources: [validatingwebhookconfigurations]
  verbs: [get, list, patch, update, watch]
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  verbs: [create, get, list, patch, update, watch]
- apiGroups: [batch]
  resources: [jobs]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [platform.kubo.io]
  resources: [stackbackups, stackbootstraps]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [vault.banzaicloud.com]
  resources: [vaults]
  verbs: [create, delete, get, list, patch, update, watch]
