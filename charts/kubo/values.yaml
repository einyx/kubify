replicaCount: 1

image:
  repository: ghcr.io/einyx/kubo
  tag: v0.1.1
  pullPolicy: IfNotPresent

# Secrets used to pull the operator image. 'ghcr' must exist in the release
# namespace (create it from a GHCR token: kubectl -n kubo-system create
# secret docker-registry ghcr --docker-server=ghcr.io --docker-username=...).
imagePullSecrets:
  - name: ghcr

webhookSecret:
  secretName: kubo-webhook-secret
  key: secret

resources:
  limits:
    cpu: 1000m
    memory: 4Gi
  requests:
    cpu: 100m
    memory: 512Mi

leaderElect: true
