apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/name: kubo
    app.kubernetes.io/managed-by: kustomize
  name: manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
# ponytail: cluster-admin because this controller installs arbitrary Helm charts;
# narrower is theater. Swap for a scoped role if you ever constrain what stacks can contain.
subjects:
- kind: ServiceAccount
  name: controller-manager
  namespace: system
