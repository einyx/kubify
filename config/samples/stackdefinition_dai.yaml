apiVersion: platform.kubo.io/v1alpha1
kind: StackDefinition
metadata:
  name: dai
spec:
  title: DAI
  description: DAI product stack (backend + frontend)
  components:
    - name: backend
      chartRef:
        repoURL: https://charts.example.invalid/dai-charts
        chartName: backend
    - name: frontend
      chartRef:
        repoURL: https://charts.example.invalid/dai-charts
        chartName: frontend
      dependsOn: [backend]
