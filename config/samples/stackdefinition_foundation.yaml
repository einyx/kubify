apiVersion: platform.kubo.io/v1alpha1
kind: StackDefinition
metadata:
  name: foundation
spec:
  title: Foundation
  description: Foundation data mesh platform (backend, frontend, storage, watcher, scheduler, processor)
  components:
    # In-cluster Postgres for now (will move to Azure Flexible Server later,
    # at which point this component is removed and connection details are
    # injected via Stack values instead).
    - name: postgres
      chartRef:
        repoURL: oci://registry-1.docker.io/bitnamicharts
        chartName: postgresql
        chartVersion: "16.7.27"
    - name: storage-engine
      chartRef:
        repoURL: https://charts.example.invalid/foundation-charts
        chartName: storage-engine
      dependsOn: [postgres]
    - name: kafka
      chartRef:
        repoURL: oci://registry-1.docker.io/bitnamicharts
        chartName: kafka
        chartVersion: "29.3.14"
      dependsOn: [postgres]
    - name: backend
      chartRef:
        repoURL: https://charts.example.invalid/foundation-charts
        chartName: backend
      dependsOn: [postgres, kafka]
    - name: frontend
      chartRef:
        repoURL: https://charts.example.invalid/foundation-charts
        chartName: frontend
      dependsOn: [backend]
    - name: watcher
      chartRef:
        repoURL: https://charts.example.invalid/foundation-charts
        chartName: watcher-v2
      dependsOn: [backend]
    - name: scheduler
      chartRef:
        repoURL: https://charts.example.invalid/foundation-charts
        chartName: scheduler
      dependsOn: [backend]
    - name: processor
      chartRef:
        repoURL: https://charts.example.invalid/foundation-charts
        chartName: processor
      dependsOn: [backend]
