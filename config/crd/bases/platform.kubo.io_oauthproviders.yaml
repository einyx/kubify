---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: oauthproviders.platform.kubo.io
spec:
  group: platform.kubo.io
  names:
    kind: OAuthProvider
    listKind: OAuthProviderList
    plural: oauthproviders
    shortNames:
    - oauthprovider
    singular: oauthprovider
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              OAuthProvider describes a centrally managed OAuth control-plane identity.
              It is cluster-scoped because one provider can provision applications for
              many tenant namespaces.
            properties:
              issuer:
                description: Issuer is the public issuer, preferably an Auth0 custom
                  domain.
                pattern: ^https://
                type: string
              managementAPIURL:
                description: |-
                  ManagementAPIURL is normally the canonical Auth0 tenant /api/v2 URL,
                  even when Issuer is a custom login domain.
                pattern: ^https://
                type: string
              managementAudience:
                description: ManagementAudience defaults to ManagementAPIURL with
                  a trailing slash.
                type: string
              managementCredentialsSecretRef:
                properties:
                  name:
                    type: string
                  namespace:
                    type: string
                required:
                - name
                - namespace
                type: object
              tokenURL:
                description: TokenURL defaults to <issuer>/oauth/token.
                type: string
              type:
                enum:
                - Auth0
                type: string
            required:
            - issuer
            - managementAPIURL
            - managementCredentialsSecretRef
            - type
            type: object
        type: object
    served: true
    storage: true
