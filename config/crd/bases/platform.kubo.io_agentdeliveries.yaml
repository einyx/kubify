---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: agentdeliveries.platform.kubo.io
spec:
  group: platform.kubo.io
  names:
    kind: AgentDelivery
    listKind: AgentDeliveryList
    plural: agentdeliveries
    shortNames:
    - adelivery
    singular: agentdelivery
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.sandboxName
      name: Sandbox
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AgentDeliverySpec describes one isolated agent delivery run.
            properties:
              command:
                description: |-
                  Command is an argv vector executed once after the sandbox becomes ready.
                  The selected agent image or kit must provide this entrypoint. Kubo adds
                  KUBO_REPOSITORY, KUBO_REVISION, KUBO_TASK, and KUBO_OUTPUT_TYPE.
                items:
                  type: string
                minItems: 1
                type: array
              output:
                properties:
                  type:
                    default: PullRequest
                    description: Type describes the expected agent result.
                    enum:
                    - PullRequest
                    - Bundle
                    type: string
                type: object
              retainSandbox:
                description: |-
                  RetainSandbox keeps the sandbox after a successful delivery for debugging.
                  Failed sandboxes are always retained until the AgentDelivery is deleted.
                type: boolean
              sandbox:
                properties:
                  agent:
                    description: Agent selects a Docker Sandboxes agent profile.
                    type: string
                  cpus:
                    description: CPUs requests a cloud compute size.
                    format: int32
                    minimum: 1
                    type: integer
                  envFromSecrets:
                    description: |-
                      EnvFromSecrets exposes explicitly selected Kubernetes Secrets to the
                      agent container. Prefer workload identity where supported.
                    items:
                      type: string
                    type: array
                  imageRef:
                    description: ImageRef selects an external OCI image. Mutually
                      exclusive with Agent.
                    type: string
                  memoryMiB:
                    description: MemoryMiB requests sandbox memory.
                    format: int64
                    minimum: 512
                    type: integer
                  policyIDs:
                    description: PolicyIDs names Docker organization policies applied
                      before startup.
                    items:
                      type: string
                    type: array
                  runtime:
                    default: Kubernetes
                    description: Runtime selects the execution backend. Defaults to
                      Kubernetes.
                    enum:
                    - Kubernetes
                    - DockerCloud
                    type: string
                  runtimeClassName:
                    description: |-
                      RuntimeClassName selects the Kubernetes isolation runtime. Defaults to
                      kata-vm-isolation for Kubernetes deliveries.
                    type: string
                  serviceAccountName:
                    description: ServiceAccountName is the identity used by the agent
                      Job.
                    type: string
                  timeoutSeconds:
                    description: TimeoutSeconds limits a Kubernetes Job. Defaults
                      to 1800 seconds.
                    format: int64
                    minimum: 60
                    type: integer
                type: object
              source:
                properties:
                  repository:
                    description: Repository is the HTTPS Git repository cloned by
                      the sandbox command.
                    pattern: ^https://
                    type: string
                  revision:
                    description: Revision is a branch, tag, or commit. Defaults to
                      main.
                    type: string
                required:
                - repository
                type: object
              task:
                description: Task is the instruction supplied to the sandboxed agent.
                minLength: 1
                type: string
            required:
            - command
            - source
            - task
            type: object
          status:
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              exitCode:
                format: int32
                type: integer
              jobName:
                description: JobName is the Kubernetes Job used by the Kata backend.
                type: string
              message:
                type: string
              observedGeneration:
                format: int64
                type: integer
              output:
                description: Output contains bounded command output intended for diagnostics.
                type: string
              phase:
                type: string
              sandboxName:
                description: SandboxName is Docker's immutable resource name (sandboxes/<id>).
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
