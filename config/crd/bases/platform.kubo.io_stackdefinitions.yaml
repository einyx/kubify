---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: stackdefinitions.platform.kubo.io
spec:
  group: platform.kubo.io
  names:
    kind: StackDefinition
    listKind: StackDefinitionList
    plural: stackdefinitions
    shortNames:
    - stackdef
    singular: stackdefinition
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.title
      name: Title
      type: string
    - jsonPath: .spec.components
      name: Components
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          StackDefinition is the cluster-level, pluggable blueprint of a product
          stack. Any product can be plugged in by authoring one of these — the
          Stack controller is generic and knows nothing about specific products.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              StackDefinitionSpec is the pluggable description of a stack product
              (e.g. foundation, dai, foundation-ai, or anything else).
            properties:
              components:
                description: Components is the ordered set of components to deploy.
                items:
                  description: |-
                    StackComponentSpec defines a single deployable component of a stack.
                    Components are rendered as Helm releases by default, but the type is
                    generic enough to describe any chart-based workload.
                  properties:
                    chartPullSecretRef:
                      description: |-
                        ChartPullSecretRef references a Secret with registry credentials
                        (imagePullSecret/dockerconfigjson format) used to pull the chart.
                        Applied to the Flux HelmRepository in Flux mode and to the Helm
                        registry client in Direct mode.
                      properties:
                        name:
                          default: ""
                          description: |-
                            Name of the referent.
                            This field is effectively required, but due to backwards compatibility is
                            allowed to be empty. Instances of this type with an empty value here are
                            almost certainly wrong.
                            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                          type: string
                      type: object
                      x-kubernetes-map-type: atomic
                    chartRef:
                      description: ChartRef points to the chart backing this component.
                      properties:
                        chartName:
                          description: ChartName is the chart name within the repository.
                          minLength: 1
                          type: string
                        chartVersion:
                          description: ChartVersion pins the chart version. Empty
                            = latest available.
                          type: string
                        repoURL:
                          description: RepoURL is the Helm repository URL.
                          minLength: 1
                          type: string
                      required:
                      - chartName
                      - repoURL
                      type: object
                    dependsOn:
                      description: DependsOn lists component names that must be Ready
                        before this one.
                      items:
                        type: string
                      type: array
                    name:
                      description: Name of the component (also used as the Helm release
                        name).
                      minLength: 1
                      type: string
                    registryAuth:
                      description: |-
                        RegistryAuth selects how the registry is authenticated when no
                        static secret is used. Currently supports "azure" (workload identity
                        via Flux source-controller) — e.g. ACR on AKS without a pull secret.
                      enum:
                      - secret
                      - azure
                      type: string
                    values:
                      description: |-
                        Values is default Helm values (deep-merged: StackDefinition defaults
                        < Stack instance overrides).
                      x-kubernetes-preserve-unknown-fields: true
                  required:
                  - chartRef
                  - name
                  type: object
                minItems: 1
                type: array
              description:
                description: Description of what this stack deploys.
                type: string
              title:
                description: Title is a human readable name.
                type: string
              valuesSchema:
                description: ValuesSchema optionally documents/validates overridable
                  values.
                x-kubernetes-preserve-unknown-fields: true
            required:
            - components
            - title
            type: object
          status:
            description: StackDefinitionStatus defines the observed state of StackDefinition.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
